<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RecMatch">
  <defs>
    <linearGradient id="gL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4A2E"/>
      <stop offset="1" stop-color="#1F7F55"/>
    </linearGradient>
    <linearGradient id="gR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62BE8E"/>
      <stop offset="1" stop-color="#2E9B62"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="24" cy="32" r="18"/>
    </clipPath>
  </defs>
  <circle cx="24" cy="32" r="18" fill="url(#gL)"/>
  <circle cx="40" cy="32" r="18" fill="url(#gR)"/>
  <!-- zone de rapprochement (intersection) -->
  <g clip-path="url(#lens)">
    <circle cx="40" cy="32" r="18" fill="#0B3B24"/>
  </g>
  <!-- onde fluide = correspondance trouvée -->
  <path d="M25.5 32 C 28.5 25.5, 35.5 25.5, 32 32 S 35.5 38.5, 38.5 32"
        fill="none" stroke="#E3F3EA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

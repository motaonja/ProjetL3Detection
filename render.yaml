databases:
  - name: recmatch-db
    databaseName: recmatch
    user: recmatch
    plan: free
    region: ohio

services:
  - type: web
    name: recmatch-app
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recmatch-db
          property: connectionString
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://recmatch-app.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://recmatch-app.onrender.com
